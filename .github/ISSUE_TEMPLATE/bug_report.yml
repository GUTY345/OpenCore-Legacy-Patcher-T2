name: Bug report
description: Report a boot, panic, or patching issue with OCLP
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please fill in as much detail as you can — panic strings and logs help the most.

  - type: dropdown
    id: mac-model
    attributes:
      label: Mac model
      description: Which Mac is affected?
      options:
        - "T2 — Mac mini (2018)"
        - "T2 — MacBook Pro 13-inch (2018-2019, 4 Thunderbolt 3)"
        - "T2 — MacBook Pro 15-inch (2018-2019)"
        - "T2 — MacBook Pro 13-inch (2020)"
        - "T2 — MacBook Pro 16-inch (2019)"
        - "T2 — MacBook Air (2018-2020)"
        - "T2 — iMac Pro (2017)"
        - "T2 — iMac 27-inch Retina 5K (2020)"
        - "T2 — Mac Pro (2019)"
        - "2013-2017 — MacBook Pro Touch Bar (2016-2017)"
        - "2013-2017 — MacBook Pro Retina (2012-2015)"
        - "2013-2017 — MacBook Air (2013-2017)"
        - "2013-2017 — MacBook Retina 12-inch (2015-2017)"
        - "2013-2017 — Mac mini (2014)"
        - "2013-2017 — iMac (2013-2017)"
        - "2013-2017 — Mac Pro (2013)"
        - "2008-2012 — MacBook (2008-2010)"
        - "2008-2012 — MacBook Air (2008-2012)"
        - "2008-2012 — MacBook Pro non-Retina (2008-2012)"
        - "2008-2012 — Mac mini (2009-2012)"
        - "2008-2012 — iMac (2008-2012)"
        - "2008-2012 — Mac Pro (2008-2012)"
    validations:
      required: true

  - type: input
    id: target-macos
    attributes:
      label: Target macOS version
      placeholder: e.g. macOS 26 Tahoe
    validations:
      required: true

  - type: input
    id: oclp-version
    attributes:
      label: OCLP version or commit
      placeholder: e.g. v2.x or commit hash
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue type
      options:
        - Boot failure
        - Kernel panic
        - Installer error
        - Graphics glitch
        - Wi-Fi / Bluetooth
        - Audio
        - Sleep / wake
        - USB
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior

  - type: textarea
    id: logs
    attributes:
      label: Panic log / additional notes
      description: Paste the panic string, csrutil status output, boot-args, etc. This is auto-formatted as a code block.
      render: shell
